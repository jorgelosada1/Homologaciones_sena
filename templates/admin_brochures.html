{% extends "layout.html" %}
{% block content %}

<style>
    .admin-page { animation: fadeIn 0.5s ease; padding-bottom: 60px; }
    .admin-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    .admin-header h2 { margin-bottom: 0; }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border-glass); transition: all 0.3s ease; }
    .back-link:hover { color: #06b6d4; border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.1); }

    .upload-zone {
        background: rgba(6,182,212,0.06);
        border: 2px dashed rgba(6,182,212,0.3);
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        margin-bottom: 32px;
        transition: all 0.3s ease;
    }
    .upload-zone:hover { border-color: rgba(6,182,212,0.5); background: rgba(6,182,212,0.1); }
    .upload-zone i { font-size: 36px; color: #06b6d4; margin-bottom: 12px; }
    .upload-zone p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone label { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 10px; background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; font-size: 14px; font-weight: 600; transition: all 0.3s ease; }
    .upload-zone label:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(6,182,212,0.3); }

    .pdf-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 16px;
    }
    .pdf-card {
        background: var(--bg-card);
        border: 1px solid var(--border-glass);
        border-radius: 14px;
        padding: 20px;
        display: flex; align-items: center; gap: 16px;
        transition: all 0.3s ease;
    }
    .pdf-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
    .pdf-icon {
        width: 48px; height: 48px; border-radius: 12px;
        background: rgba(239,68,68,0.12);
        display: flex; align-items: center; justify-content: center;
        font-size: 22px; color: #ef4444; flex-shrink: 0;
    }
    .pdf-info { flex: 1; min-width: 0; }
    .pdf-name { font-size: 13px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pdf-ext { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .btn-icon { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 12px; }
    .btn-sm { padding: 8px 16px; font-size: 13px; border-radius: 8px; }
</style>

<div class="admin-page">
    <div class="admin-header">
        <h2><i class="fa-solid fa-file-pdf" style="color: #06b6d4"></i> Brochures</h2>
        <a href="/admin/dashboard" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="upload-zone">
        <input type="hidden" name="action" value="upload">
        <i class="fa-solid fa-file-arrow-up"></i>
        <p>Arrastra archivos PDF aquí o haz clic para seleccionar<br><small>Solo archivos .pdf</small></p>
        <input type="file" name="pdfs" id="pdfInput" multiple accept=".pdf">
        <label for="pdfInput"><i class="fa-solid fa-folder-open"></i> Seleccionar PDFs</label>
        <br><br>
        <button type="submit" class="btn btn-primary btn-sm" style="background: linear-gradient(135deg, #06b6d4, #0891b2)"><i class="fa-solid fa-upload"></i> Subir</button>
    </form>

    <h3 style="margin-bottom: 16px; color: var(--text-secondary); font-size: 14px;">
        <i class="fa-solid fa-file-pdf" style="color: #06b6d4"></i>
        {{ archivos|length }} brochures subidos
    </h3>

    <div class="pdf-grid">
        {% for pdf in archivos %}
        <div class="pdf-card">
            <div class="pdf-icon"><i class="fa-solid fa-file-pdf"></i></div>
            <div class="pdf-info">
                <div class="pdf-name" title="{{ pdf }}">{{ pdf }}</div>
                <div class="pdf-ext">PDF</div>
            </div>
            <form method="POST" style="margin:0" onsubmit="return confirm('¿Eliminar este brochure?')">
                <input type="hidden" name="action" value="delete">
                <input type="hidden" name="filename" value="{{ pdf }}">
                <button type="submit" class="btn btn-danger btn-icon" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
            </form>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
