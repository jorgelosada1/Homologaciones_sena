{% extends "layout.html" %}
{% block content %}

<style>
    .admin-page { animation: fadeIn 0.5s ease; padding-bottom: 40px; }
    .admin-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
    .admin-header h2 { margin-bottom: 0; }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border-color); transition: var(--transition); }
    .back-link:hover { color: #06b6d4; border-color: rgba(6,182,212,0.3); background: rgba(6,182,212,0.04); }
    .upload-zone { background: rgba(6,182,212,0.03); border: 2px dashed rgba(6,182,212,0.2); border-radius: 14px; padding: 32px 28px; text-align: center; margin-bottom: 28px; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .upload-zone:hover { border-color: rgba(6,182,212,0.4); }
    .upload-zone .upload-icon { font-size: 32px; color: #06b6d4; }
    .upload-zone p { color: var(--text-muted); font-size: 13px; margin: 4px 0 8px; }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone label { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 8px 20px; border-radius: 8px; background: #06b6d4; color: white; font-size: 13px; font-weight: 600; transition: var(--transition); }
    .upload-zone label:hover { opacity: 0.9; transform: translateY(-1px); }
    .upload-zone .upload-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .pdf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .pdf-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 14px; transition: var(--transition); box-shadow: var(--shadow-sm); }
    .pdf-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .pdf-icon { width: 42px; height: 42px; border-radius: 10px; background: #fef2f2; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #ef4444; flex-shrink: 0; }
    .pdf-info { flex: 1; min-width: 0; }
    .pdf-name { font-size: 13px; font-weight: 600; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pdf-ext { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .btn-icon { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 11px; }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 8px; }
</style>

<div class="admin-page">
    <div class="admin-header">
        <h2><i class="fa-solid fa-file-pdf" style="color: #06b6d4"></i> Brochures</h2>
        <a href="/admin/dashboard" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
    </div>
    <form method="POST" enctype="multipart/form-data" class="upload-zone">
        <input type="hidden" name="action" value="upload">
        <i class="fa-solid fa-file-arrow-up upload-icon"></i>
        <p>Arrastra archivos PDF aquí o haz clic para seleccionar<br><small>Solo archivos .pdf</small></p>
        <input type="file" name="pdfs" id="pdfInput" multiple accept=".pdf">
        <div class="upload-actions">
            <label for="pdfInput"><i class="fa-solid fa-folder-open"></i> Seleccionar</label>
            <button type="submit" class="btn btn-primary btn-sm" style="background:#06b6d4"><i class="fa-solid fa-upload"></i> Subir</button>
        </div>
    </form>
    <h3 style="margin-bottom:14px;color:var(--text-secondary);font-size:14px;"><i class="fa-solid fa-file-pdf" style="color:#06b6d4"></i> {{ archivos|length }} brochures subidos</h3>
    <div class="pdf-grid">
        {% for pdf in archivos %}
        <div class="pdf-card">
            <div class="pdf-icon"><i class="fa-solid fa-file-pdf"></i></div>
            <div class="pdf-info"><div class="pdf-name" title="{{ pdf }}">{{ pdf }}</div><div class="pdf-ext">PDF</div></div>
            <form method="POST" style="margin:0" onsubmit="return confirm('¿Eliminar este brochure?')">
                <input type="hidden" name="action" value="delete"><input type="hidden" name="filename" value="{{ pdf }}">
                <button type="submit" class="btn btn-danger btn-icon" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
            </form>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
