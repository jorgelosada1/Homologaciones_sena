<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso – Areandina</title>
    <meta name="description" content="Inicio de sesión al Sistema de Homologaciones SENA – Areandina.">
    <link rel="icon" type="image/jpeg" href="{{ url_for('logo') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f19;
            position: relative;
            overflow: hidden;
        }

        /* Premium animated mesh background */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(at 0% 0%, #15220c 0px, transparent 50%),
                        radial-gradient(at 100% 0%, #1e111d 0px, transparent 50%),
                        radial-gradient(at 100% 100%, #1c2712 0px, transparent 50%),
                        radial-gradient(at 0% 100%, #0e1628 0px, transparent 50%);
            opacity: 0.8;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 0;
            pointer-events: none;
        }

        /* Elegant geometric shapes floating */
        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bg-shapes .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            filter: blur(12px);
            animation: floatShape linear infinite;
        }

        .bg-shapes .shape.circle {
            background: linear-gradient(135deg, #7fb536, #4ade80);
        }

        .bg-shapes .shape.ring {
            background: transparent;
            border: 4px solid rgba(127, 181, 54, 0.3);
        }

        .bg-shapes .shape.square {
            border-radius: 24px;
            background: linear-gradient(135deg, #e6007e, #f43f5e);
        }

        .bg-shapes .shape.dot {
            background: #f59c2f;
        }

        @keyframes floatShape {
            0% {
                opacity: 0;
                transform: translateY(110vh) rotate(0deg) scale(0.6);
            }
            15% {
                opacity: 0.25;
            }
            85% {
                opacity: 0.25;
            }
            100% {
                opacity: 0;
                transform: translateY(-20vh) rotate(360deg) scale(1.2);
            }
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #7fb536, #e6007e);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-logo .icon-circle {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            background: linear-gradient(135deg, #7fb536, #5d8b22);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #ffffff;
            margin-bottom: 18px;
            box-shadow: 0 8px 24px rgba(127, 181, 54, 0.3);
        }

        .login-logo h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .login-logo p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 2.5px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .login-form {
            margin-top: 24px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            transition: color 0.25s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #7fb536;
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(127, 181, 54, 0.15);
        }

        .input-wrapper input:focus ~ i {
            color: #7fb536;
        }

        .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .input-wrapper input[readonly] {
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.01);
            border-color: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #7fb536, #5d8b22);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
            box-shadow: 0 8px 24px rgba(127, 181, 54, 0.25);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(127, 181, 54, 0.35);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .login-footer {
            text-align: center;
            margin-top: 36px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
        }

        .login-footer span {
            color: #7fb536;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 40px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="mesh-bg"></div>
    <div class="bg-grid"></div>

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-logo">
                <div class="icon-circle">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1>Areandina</h1>
                <p>Sistema de Homologaciones</p>
            </div>

            <form class="login-form" method="POST" action="/login">
                {% if error %}
                <div class="error-msg">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ error }}
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="user">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="user" name="user" placeholder="Ingrese su usuario" value="Innovacion" readonly>
                        <i class="fa-solid fa-user" style="pointer-events:none;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" autofocus>
                        <i class="fa-solid fa-lock" style="pointer-events:none;"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Ingresar
                </button>
            </form>

            <div class="login-footer">
                Acceso restringido · <span>Innovación Areandina</span>
            </div>
        </div>
    </div>

    <!-- Floating geometric shapes -->
    <div class="bg-shapes" id="bgShapes"></div>

    <script>
        (function() {
            const container = document.getElementById('bgShapes');
            const types = ['circle', 'ring', 'square', 'dot'];
            const count = 15;

            for (let i = 0; i < count; i++) {
                const shape = document.createElement('div');
                const type = types[Math.floor(Math.random() * types.length)];
                const size = type === 'dot' ? (6 + Math.random() * 8) : (40 + Math.random() * 80);
                const left = Math.random() * 100;
                const duration = 20 + Math.random() * 20;
                const delay = Math.random() * duration;

                shape.className = `shape ${type}`;
                shape.style.width = size + 'px';
                shape.style.height = size + 'px';
                shape.style.left = left + '%';
                shape.style.animationDuration = duration + 's';
                shape.style.animationDelay = '-' + delay + 's';

                container.appendChild(shape);
            }
        })();
    </script>
</body>

</html>
