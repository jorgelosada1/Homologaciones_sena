<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso – Areandina</title>
    <meta name="description" content="Inicio de sesión al Sistema de Homologaciones SENA – Areandina.">
    <link rel="icon" type="image/jpeg" href="{{ url_for('logo') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        /* Elegant geometric background */
        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-shapes .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: floatShape linear infinite;
        }

        .bg-shapes .shape.circle {
            background: rgba(127, 181, 54, 0.18);
        }

        .bg-shapes .shape.ring {
            background: transparent;
            border: 2.5px solid rgba(127, 181, 54, 0.22);
        }

        .bg-shapes .shape.square {
            border-radius: 12px;
            background: rgba(230, 0, 126, 0.12);
        }

        .bg-shapes .shape.dot {
            background: rgba(245, 156, 47, 0.25);
        }

        @keyframes floatShape {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-20vh) rotate(360deg) scale(1);
            }
        }

        /* Subtle grid pattern */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(127, 181, 54, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127, 181, 54, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Soft gradient corners */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 0% 0%, rgba(127, 181, 54, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 100%, rgba(230, 0, 126, 0.10) 0%, transparent 50%),
                radial-gradient(ellipse at 100% 0%, rgba(245, 156, 47, 0.08) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 48px 40px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
            animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 12px;
        }

        .login-logo .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: #7fb536;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 16px;
        }

        .login-logo h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .login-logo p {
            font-size: 12px;
            color: #9ca3af;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .login-form {
            margin-top: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
            transition: color 0.25s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #1f2937;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.25s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #7fb536;
            box-shadow: 0 0 0 3px rgba(127, 181, 54, 0.12);
        }

        .input-wrapper input:focus ~ i {
            color: #7fb536;
        }

        .input-wrapper input::placeholder {
            color: #d1d5db;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #7fb536;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #6a9a2d;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(127, 181, 54, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 11px;
            color: #9ca3af;
        }

        .login-footer span {
            color: #7fb536;
            font-weight: 600;
        }

        /* Accent line */
        .accent-line {
            height: 3px;
            border-radius: 3px;
            background: #7fb536;
            margin-bottom: 32px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="accent-line"></div>

            <div class="login-logo">
                <div class="icon-circle">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1>Areandina</h1>
                <p>Sistema de Homologaciones</p>
            </div>

            <form class="login-form" method="POST" action="/login">
                {% if error %}
                <div class="error-msg">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ error }}
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="user">Usuario</label>
                    <div class="input-wrapper">
                        <input type="text" id="user" name="user" placeholder="Ingrese su usuario" value="Innovacion" readonly>
                        <i class="fa-solid fa-user" style="pointer-events:none;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" autofocus>
                        <i class="fa-solid fa-lock" style="pointer-events:none;"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Ingresar
                </button>
            </form>

            <div class="login-footer">
                Acceso restringido · <span>Innovación Areandina</span>
            </div>
        </div>
    </div>

    <!-- Floating geometric shapes -->
    <div class="bg-shapes" id="bgShapes"></div>

    <script>
        (function() {
            const container = document.getElementById('bgShapes');
            const types = ['circle', 'ring', 'square', 'dot'];
            const count = 18;

            for (let i = 0; i < count; i++) {
                const shape = document.createElement('div');
                const type = types[Math.floor(Math.random() * types.length)];
                const size = type === 'dot' ? (6 + Math.random() * 10) : (30 + Math.random() * 80);
                const left = Math.random() * 100;
                const duration = 18 + Math.random() * 25;
                const delay = Math.random() * duration;

                shape.className = `shape ${type}`;
                shape.style.width = size + 'px';
                shape.style.height = size + 'px';
                shape.style.left = left + '%';
                shape.style.animationDuration = duration + 's';
                shape.style.animationDelay = '-' + delay + 's';

                container.appendChild(shape);
            }
        })();
    </script>
</body>

</html>
