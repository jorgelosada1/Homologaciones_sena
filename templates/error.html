{% extends "layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_heading %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card card-pad fade-up" style="max-width:560px;margin:40px auto;text-align:center">
    <div class="empty" style="padding:24px 10px">
        <div class="empty-icon" style="background:var(--danger-soft);color:var(--danger)"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <p class="eyebrow" style="color:var(--danger)">Error {{ code }}</p>
        <h4 style="font-size:22px;margin:6px 0 8px">{{ title }}</h4>
        <p>{{ message }}</p>
        <div class="row" style="justify-content:center;margin-top:20px">
            <a href="javascript:history.back()" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            <a href="/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Ir al inicio</a>
        </div>
    </div>
</div>
{% endblock %}
