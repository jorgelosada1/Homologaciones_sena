{% extends "layout.html" %}
{% block content %}

<style>
    .admin-login-container { display: flex; align-items: center; justify-content: center; min-height: 75vh; animation: fadeIn 0.5s ease; }
    .admin-login-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 44px 36px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow-md); }
    .admin-login-icon { width: 60px; height: 60px; border-radius: 16px; background: rgba(127,181,54,0.08); border: 1px solid rgba(127,181,54,0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 24px; color: var(--accent); }
    .admin-login-card h2 { justify-content: center; font-size: 22px; margin-bottom: 6px; }
    .admin-login-card .subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 28px; }
    .admin-login-card input[type="password"] { padding: 12px 16px; font-size: 14px; margin-bottom: 18px; border-radius: 10px; text-align: center; letter-spacing: 3px; }
    .admin-login-card .btn { width: 100%; padding: 12px; font-size: 14px; border-radius: 10px; background: var(--accent); color: white; border: none; }
    .admin-login-card .btn:hover { background: var(--accent-dark); transform: translateY(-1px); }
    .admin-error { background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 18px; display: flex; align-items: center; gap: 6px; justify-content: center; }
</style>

<div class="admin-login-container">
    <div class="admin-login-card">
        <div class="admin-login-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h2>Panel Admin</h2>
        <p class="subtitle">Ingresa la contraseña para acceder</p>
        {% if error %}
        <div class="admin-error"><i class="fa-solid fa-circle-exclamation"></i> {{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="••••••••" required autofocus>
            <button type="submit" class="btn"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
        </form>
    </div>
</div>

{% endblock %}
