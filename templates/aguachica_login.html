{% extends "layout.html" %}
{% block title %}Aguachica{% endblock %}
{% block content %}
<div class="card fade-up" style="max-width:420px;margin:40px auto;overflow:hidden">
    <div style="padding:28px;background:linear-gradient(135deg,var(--blue-soft),transparent)">
        <span class="head-icon blue"><i class="fa-solid fa-chart-line"></i></span>
        <h2 style="font-size:22px;margin-top:14px">CSU Aguachica</h2>
        <p class="muted" style="margin-top:4px">Control semanal de llamadas, inscritos y pagos.</p>
    </div>
    <form method="POST" class="stack" style="padding:24px;gap:14px">
        {% if error %}<div class="alert error"><i class="fa-solid fa-circle-exclamation"></i>{{ error }}</div>{% endif %}
        <div class="field"><label class="label">Usuario</label><div class="input-icon"><i class="fa-regular fa-user"></i><input type="text" name="user" required autofocus></div></div>
        <div class="field"><label class="label">Contraseña</label><div class="input-icon"><i class="fa-solid fa-lock"></i><input type="password" name="password" required></div></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Ingresar</button>
    </form>
</div>
{% endblock %}
