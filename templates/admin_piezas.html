{% extends "layout.html" %}
{% block content %}

<style>
    .admin-page { animation: fadeIn 0.5s ease; padding-bottom: 40px; }
    .admin-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; }
    .admin-header h2 { margin-bottom: 0; }
    .back-link { color: var(--text-muted); text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border-color); transition: var(--transition); }
    .back-link:hover { color: var(--accent-pink); border-color: rgba(230,0,126,0.3); background: rgba(230,0,126,0.04); }
    .upload-zone { background: rgba(230,0,126,0.03); border: 2px dashed rgba(230,0,126,0.2); border-radius: 14px; padding: 32px 28px; text-align: center; margin-bottom: 28px; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .upload-zone:hover { border-color: rgba(230,0,126,0.4); }
    .upload-zone .upload-icon { font-size: 32px; color: var(--accent-pink); }
    .upload-zone p { color: var(--text-muted); font-size: 13px; margin: 4px 0 8px; }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone label { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 8px 20px; border-radius: 8px; background: var(--accent-pink); color: white; font-size: 13px; font-weight: 600; transition: var(--transition); }
    .upload-zone label:hover { opacity: 0.9; transform: translateY(-1px); }
    .upload-zone .upload-actions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .img-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; transition: var(--transition); box-shadow: var(--shadow-sm); }
    .img-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .img-card img { width: 100%; height: 140px; object-fit: cover; }
    .img-card-info { padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .img-card-name { font-size: 11px; color: var(--text-muted); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-icon { width: 28px; height: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 11px; }
    .btn-sm { padding: 7px 14px; font-size: 12px; border-radius: 8px; }
</style>

<div class="admin-page">
    <div class="admin-header">
        <h2><i class="fa-solid fa-images" style="color: var(--accent-pink)"></i> Piezas Gráficas</h2>
        <a href="/admin/dashboard" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al panel</a>
    </div>
    <form method="POST" enctype="multipart/form-data" class="upload-zone" id="uploadForm">
        <input type="hidden" name="action" value="upload">
        <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
        <p>Arrastra imágenes aquí o haz clic para seleccionar<br><small>Formatos: PNG, JPG, JPEG, GIF, WEBP</small></p>
        <input type="file" name="imagenes" id="fileInput" multiple accept=".png,.jpg,.jpeg,.gif,.webp">
        <div class="upload-actions">
            <label for="fileInput"><i class="fa-solid fa-folder-open"></i> Seleccionar</label>
            <button type="submit" class="btn btn-primary btn-sm" style="background:var(--accent-pink)"><i class="fa-solid fa-upload"></i> Subir</button>
        </div>
    </form>
    <h3 style="margin-bottom:14px;color:var(--text-secondary);font-size:14px;"><i class="fa-solid fa-images" style="color:var(--accent-pink)"></i> {{ imagenes|length }} imágenes subidas</h3>
    <div class="img-grid">
        {% for img in imagenes %}
        <div class="img-card">
            <img src="/static/piezas/{{ img }}" alt="{{ img }}">
            <div class="img-card-info">
                <span class="img-card-name" title="{{ img }}">{{ img }}</span>
                <form method="POST" style="margin:0" onsubmit="return confirm('¿Eliminar esta imagen?')">
                    <input type="hidden" name="action" value="delete"><input type="hidden" name="filename" value="{{ img }}">
                    <button type="submit" class="btn btn-danger btn-icon" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
                </form>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
